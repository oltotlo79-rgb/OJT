<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP。設計仕様 §1.2（完全オフライン）／指摘 DM-9。
      外へ出る先を1つも許さないので、どのディレクティブも `'self'` か `'none'` で閉じる。
      `default-src` に落とさず**全部書く**のが要点で、落とすと「どれを意図して許したのか」が
      読めなくなり、あとから1つ緩めたときに気づけない。

      `frame-ancestors` は meta で配っても効かない（HTTPヘッダ専用。起動時にコンソールへ
      その旨が1行出る）。それでも**意図の記録として残す**: 埋め込みを実際に止めているのは
      `frame-src 'none'` と main の `setWindowOpenHandler`（常に deny）である。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; frame-src 'none'; frame-ancestors 'none'"
    />
    <title>電気教育ツール</title>
    <style>
      html,
      body {
        margin: 0;
        background: #1b1e24;
      }
      #startup {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        overflow: auto;
        color: #eef6f8;
        background: radial-gradient(ellipse at 70% 20%, #163442 0, transparent 60%), #09171f;
        font-family: 'Yu Gothic UI', 'Meiryo', sans-serif;
        padding: clamp(24px, 5vw, 64px);
        box-sizing: border-box;
      }
      .startup-panel {
        width: min(100%, 920px);
        box-sizing: border-box;
        padding: clamp(28px, 4vw, 48px);
        border: 1px solid #2a4552;
        border-radius: 20px;
        background:
          linear-gradient(#29444f24 1px, transparent 1px),
          linear-gradient(90deg, #29444f24 1px, transparent 1px),
          linear-gradient(135deg, #112934, #0c1d27);
        background-size:
          40px 40px,
          40px 40px,
          auto;
        box-shadow: 0 24px 80px #00000040;
      }
      .startup-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #83ddca;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.2em;
      }
      .startup-brand::before {
        content: '';
        width: 24px;
        height: 3px;
        background: currentColor;
        border-radius: 2px;
      }
      .startup-hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        align-items: center;
        gap: 28px;
        margin: 28px 0 32px;
      }
      #startup h1 {
        font-size: clamp(28px, 4vw, 42px);
        font-weight: 600;
        letter-spacing: 0.04em;
        line-height: 1.5;
        margin: 0 0 14px;
      }
      .startup-tagline {
        color: #b4c9d3;
        font-size: 15px;
        line-height: 1.9;
        margin: 0;
      }
      .startup-circuit {
        width: 100%;
        height: auto;
        color: #7bd7c4;
      }
      .startup-circuit .circuit-base {
        stroke: #385764;
      }
      .startup-circuit .circuit-pulse {
        animation: startup-pulse 2.8s ease-in-out infinite;
        transform-origin: center;
      }
      .startup-state {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 22px;
      }
      .startup-state::before {
        content: '';
        width: 7px;
        height: 7px;
        flex: 0 0 auto;
        background: #83ddca;
        border-radius: 50%;
        box-shadow: 0 0 0 4px #83ddca12;
      }
      #startup-status {
        font-size: 17px;
        font-weight: 600;
        line-height: 1.8;
        margin: 0;
      }
      #startup-detail {
        color: #a4bdc9;
        font-size: 13px;
        line-height: 1.8;
        max-width: 640px;
        margin: 8px 0 0 17px;
      }
      #startup-indicator {
        height: 3px;
        overflow: hidden;
        background: #2a414c;
        border-radius: 3px;
      }
      #startup-indicator span {
        display: block;
        width: 28%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #83ddca 50%, #c5f4e9);
        border-radius: inherit;
        animation: startup-flow 2.6s ease-in-out infinite;
      }
      #startup-indicator[hidden],
      #startup-retry[hidden] {
        display: none;
      }
      #startup-retry {
        min-height: 44px;
        padding: 10px 24px;
        margin: 20px 0 0 17px;
        color: #0b2925;
        background: #83ddca;
        border: 1px solid #a1e9d9;
        border-radius: 8px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #startup-retry:hover {
        background: #a1e9d9;
      }
      #startup-retry:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: 4px;
      }
      #startup[data-state='error'] .startup-state::before {
        background: #e7ba79;
        box-shadow: 0 0 0 4px #e7ba7914;
      }
      #startup[data-state='error'] .circuit-pulse {
        animation: none;
      }
      @keyframes startup-flow {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(460%);
        }
      }
      @keyframes startup-pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
      @media (max-width: 740px) {
        .startup-hero {
          grid-template-columns: minmax(0, 1fr) 170px;
          gap: 12px;
        }
      }
      @media (max-width: 560px) {
        .startup-hero {
          grid-template-columns: 1fr;
        }
        .startup-circuit {
          width: 180px;
          justify-self: end;
          margin-top: -6px;
        }
        #startup-detail {
          margin-left: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #startup-indicator span,
        .startup-circuit .circuit-pulse {
          animation: none;
        }
        #startup-indicator span {
          transform: translateX(125%);
        }
      }
      .screen-loading {
        display: grid;
        place-content: center;
        height: 100%;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="startup" role="status" aria-live="polite">
      <div class="startup-panel">
        <div class="startup-brand" aria-hidden="true">ELECTRICAL TRAINING</div>
        <div class="startup-hero">
          <div>
            <h1>電気教育ツール</h1>
            <p class="startup-tagline">つないで、測って、動きを理解する。</p>
          </div>
          <svg class="startup-circuit" viewBox="0 0 320 200" aria-hidden="true" focusable="false">
            <g
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path class="circuit-base" d="M24 36H296V164H24Z M24 100H88 M232 100H296" />
              <path
                d="M24 36H88Q100 36 100 48V88Q100 100 112 100H136 M184 100H212Q224 100 224 88V48Q224 36 236 36H296"
              />
              <rect x="136" y="83" width="48" height="34" rx="5" />
              <path d="M147 100h26 M24 164H112 M112 164l34-20 M156 164H296" />
              <circle cx="24" cy="36" r="6" fill="#112934" />
              <circle cx="296" cy="36" r="6" fill="#112934" />
              <circle cx="24" cy="164" r="6" fill="#112934" />
              <circle cx="296" cy="164" r="6" fill="#112934" />
              <circle cx="112" cy="164" r="3" fill="currentColor" />
              <circle cx="156" cy="164" r="3" fill="currentColor" />
            </g>
            <circle class="circuit-pulse" cx="296" cy="100" r="5" fill="#e7ba79" />
            <circle class="circuit-pulse" cx="24" cy="100" r="4" fill="#83ddca" />
          </svg>
        </div>
        <div id="startup-indicator" aria-hidden="true"><span></span></div>
        <div class="startup-state"><p id="startup-status">起動しています…</p></div>
        <p id="startup-detail">画面を準備しています。しばらくお待ちください。</p>
        <button id="startup-retry" type="button" hidden>再読み込み</button>
      </div>
    </div>
    <div id="root" aria-busy="true"></div>
    <script type="module" src="./startup.ts"></script>
  </body>
</html>
